[package]
name = "auth"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]

# openvpn can run a thousand or more auth processes at once, so optimize for size
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
